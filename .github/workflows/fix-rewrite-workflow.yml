name: Fix A1 rewrite workflow
on:
  push:
    paths:
      - '.fix-a1-rewrite'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch generator
        run: |
          python3 - <<'PY'
          p='.github/workflows/rewrite-a1-s01.yml'
          s=open(p,encoding='utf-8').read()
          needle="            add('sentence_builder','Склади речення з поданих частин.',{tokens:w[6][3].split(' ')},w[6][3],`Правильна послідовність утворює: ${w[6][3]}`,'medium');"
          repl=needle+"\n            e[e.length-1].correctSentence=w[6][3];"
          if 'e[e.length-1].correctSentence=w[6][3];' not in s:
            s=s.replace(needle,repl)
          open(p,'w',encoding='utf-8').write(s)
          PY
          printf 'fix-%s\n' "$(date +%s)" > .rewrite-a1-s01
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/rewrite-a1-s01.yml .rewrite-a1-s01
          git commit -m 'Fix A1 Section 01 rewrite generator' || exit 0
          git push
