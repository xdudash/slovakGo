name: Temporary lesson QA
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repair generated JSON envelopes
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const files=['lessons/a1/a1-s01-l01.json','lessons/a1/a1-s01-l02.json','lessons/a1/a1-s01-l03.json','lessons/a1/a1-s01-l04.json','lessons/a1/a1-s01-l05.json','lessons/a1/a1-s01-l06.json'];
          for(const f of files){let s=fs.readFileSync(f,'utf8');try{JSON.parse(s);continue}catch(e){} if(s.endsWith('}}}}]}')){s=s.slice(0,-6)+'}}]}' }else if(s.endsWith('}}}}]')){s=s.slice(0,-5)+'}}]}' }else{throw new Error('Unexpected parse failure in '+f)} fs.writeFileSync(f,s);console.log('repaired '+f)}
          NODE
          if git diff --quiet; then echo 'No repair needed'; else git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add lessons/a1/*.json; git commit -m 'Auto-repair Section 01 JSON envelopes'; git push; fi
      - run: npm run qa:lessons -- lessons/a1/a1-s01-l01.json lessons/a1/a1-s01-l02.json lessons/a1/a1-s01-l03.json lessons/a1/a1-s01-l04.json lessons/a1/a1-s01-l05.json lessons/a1/a1-s01-l06.json
