name: Temporary lesson QA
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repair schema conflicts
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const files=['lessons/a1/a1-s01-l01.json','lessons/a1/a1-s01-l02.json','lessons/a1/a1-s01-l03.json','lessons/a1/a1-s01-l04.json','lessons/a1/a1-s01-l05.json','lessons/a1/a1-s01-l06.json'];
          for(const f of files){const d=JSON.parse(fs.readFileSync(f,'utf8'));for(const l of d.lessons||[]){if(l.finalSituation?.type==='interactive_scenario' && l.finalSituation.screenType==='final_life_situation') delete l.finalSituation.screenType;}fs.writeFileSync(f,JSON.stringify(d));console.log('checked '+f)}
          NODE
          if git diff --quiet; then echo 'No schema repair needed'; else git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add lessons/a1/*.json; git commit -m 'Align Section 01 final situations with schema'; git push; fi
      - name: Verify lesson JSON
        run: node -e "const fs=require('fs'); for(const f of ['lessons/a1/a1-s01-l01.json','lessons/a1/a1-s01-l02.json','lessons/a1/a1-s01-l03.json','lessons/a1/a1-s01-l04.json','lessons/a1/a1-s01-l05.json','lessons/a1/a1-s01-l06.json']) JSON.parse(fs.readFileSync(f,'utf8')); console.log('JSON parse PASS')"
      - name: Schema QA
        run: npx --yes ajv-cli validate -s curriculum/lesson.schema.json -d 'lessons/a1/*.json' --spec=draft2020
      - name: Runtime QA
        run: npm run qa:lessons -- lessons/a1/a1-s01-l01.json lessons/a1/a1-s01-l02.json lessons/a1/a1-s01-l03.json lessons/a1/a1-s01-l04.json lessons/a1/a1-s01-l05.json lessons/a1/a1-s01-l06.json
